<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sorveteria Sensação</title>
    <link rel="icon" type="image/jpeg" href="Logo.jpeg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #0f172a;
            overflow-x: hidden;
        }

        .login-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        /* --- PAINEL ESQUERDO (BRANDING) --- */
        .brand-section {
            flex: 1.1;
            background: radial-gradient(circle at 20% 20%, #7e22ce 0%, #581c87 40%, #3b0764 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Elementos decorativos animados */
        .brand-section::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: -150px;
            left: -150px;
            border-radius: 50%;
            animation: float 12s infinite alternate ease-in-out;
        }

        .brand-section::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            animation: float 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .brand-content {
            position: relative;
            z-index: 2;
            max-width: 440px;
            animation: fadeIn 0.8s ease-out;
        }

        .logo-box {
            width: 130px;
            height: 130px;
            border-radius: 30px;
            margin: 0 auto 28px auto;
            padding: 8px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-box:hover {
            transform: translateY(-6px) rotate(2deg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 22px;
            object-fit: cover;
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffffff 0%, #e9d5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle-highlight {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f472b6 0%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .brand-description {
            font-size: 1rem;
            color: #d8b4fe;
            line-height: 1.6;
            font-weight: 400;
        }

        /* --- PAINEL DIREITO (FORMULÁRIO) --- */
        .form-section {
            flex: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #ffffff;
            position: relative;
        }

        .form-container {
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.8s ease-out 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .form-header {
            margin-bottom: 36px;
        }

        .form-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.8px;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 0.95rem;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0f172a;
            background-color: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .input-wrapper input:focus {
            background-color: #ffffff;
            border-color: #9333ea;
            box-shadow: 0 0 0 4px rgba(147, 51, 234, 0.12);
        }

        .input-wrapper input:focus ~ .input-icon {
            color: #9333ea;
        }

        /* Botão Mostrar Senha */
        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .toggle-password:hover {
            color: #7e22ce;
            background-color: #f1f5f9;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(126, 34, 206, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(126, 34, 206, 0.45);
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Animação suave de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 900px) {
            .login-wrapper {
                flex-direction: column;
            }

            .brand-section {
                flex: none;
                padding: 50px 24px 40px 24px;
            }

            .logo-box {
                width: 100px;
                height: 100px;
                border-radius: 24px;
                margin-bottom: 20px;
            }

            .brand-title {
                font-size: 2.2rem;
            }

            .brand-subtitle-highlight {
                font-size: 2rem;
                margin-bottom: 12px;
            }

            .form-section {
                flex: 1;
                padding: 40px 24px;
                border-radius: 28px 28px 0 0;
                margin-top: -20px;
                z-index: 3;
            }
        }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <div class="login-wrapper">
        <!-- Lado Esquerdo: Marca -->
        <div class="brand-section">
            <div class="brand-content">
                <div class="logo-box">
                    <img src="Logo.jpeg" alt="Logo Sorveteria Sensação">
                </div>
                <h1 class="brand-title">Sorveteria</h1>
                <div class="brand-subtitle-highlight">Sensação</div>
                <p class="brand-description">O sistema de gestão mais refrescante e completo para o seu negócio.</p>
            </div>
        </div>

        <!-- Lado Direito: Formulário -->
        <div class="form-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Gestor de Pedidos</h2>
                    <p>Entre com suas credenciais para continuar.</p>
                </div>

                <form id="loginForm" onsubmit="realizarLogin(event)">
                    <!-- Campo Usuário -->
                    <div class="input-group">
                        <label for="username">Usuário</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="user" size="20"></i></span>
                            <input type="text" id="username" placeholder="Digite seu usuário" required autocomplete="username">
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="lock" size="20"></i></span>
                            <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar Senha" aria-label="Mostrar/Ocultar Senha">
                                <i data-lucide="eye" id="eyeIcon" size="20"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Botão de Envio -->
                    <button type="submit" class="btn-submit">
                        <span>Entrar no Sistema</span>
                        <i data-lucide="arrow-right" size="20"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Inicializa os ícones Lucide
        lucide.createIcons();

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function realizarLogin(e) {
            e.preventDefault();
            const login = document.getElementById('username').value.trim();
            const senha = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = data.redirect || 'atendimento.html';
                } else {
                    alert(data.message || data.error || 'Usuário ou senha incorretos!');
                }
            } catch (err) {
                console.error('Erro no login:', err);
                alert('Erro de conexão com o servidor.');
            }
        }
    </script>
</body>

</html>
